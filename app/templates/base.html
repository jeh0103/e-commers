<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>CRM 운영</span>
        </a>
        <nav class="nav" aria-label="주요 화면">
          <a href="/" class="{{ 'active' if path == '/' else '' }}">고객 관리</a>
          <a href="/risky" class="{{ 'active' if path == '/risky' else '' }}">우선 연락</a>
          <a href="/vip" class="{{ 'active' if path == '/vip' else '' }}">VIP 관리</a>
          <a href="/customer-types" class="{{ 'active' if path == '/customer-types' else '' }}">고객 유형</a>
        </nav>
        <div class="topbar-meta">
          <span class="status-dot" aria-hidden="true"></span>
          <span>관리자 화면</span>
        </div>
      </div>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', path='/app.js') }}"></script>
  </body>
</html>
